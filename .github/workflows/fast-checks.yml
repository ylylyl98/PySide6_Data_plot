name: Fast PR checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quick-checks:
    name: quick-checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run representative core tests
        run: >-
          python -m unittest -v
          tests.test_dat_loader
          tests.test_loader
          tests.test_processing_derivative
          tests.test_shg_fit
          tests.test_power_series
          tests.test_compare_vp
          tests.test_colormaps
          tests.test_release_version
      - name: Run smoke check
        run: python scripts/smoke_check.py
