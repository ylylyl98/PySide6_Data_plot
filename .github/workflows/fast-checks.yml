name: Fast PR checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quick-checks:
    name: quick-checks
    runs-on: windows-latest
    # BN qualification reruns the full selector on injected weak features.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run representative core tests
        run: >-
          python -m unittest -v
          tests.test_dat_loader
          tests.test_loader
          tests.test_processing_derivative
          tests.test_drr_bn_calibration
          tests.test_drr_bn_settings_compatibility
          tests.test_drr_bn_joint
          tests.test_drr_bn_joint_independent
          tests.test_drr_bn_d2_objective
          tests.test_drr_bn_d2_priority_independent
          tests.test_drr_bn_shrinkage
          tests.test_drr_bn_shrinkage_independent
          tests.test_drr_bn_fingerprint
          tests.test_drr_bn_derivative_protection
          tests.test_drr_bn_store
          tests.test_drr_bn_integration
          tests.test_shg_fit
          tests.test_power_series
          tests.test_compare_vp
          tests.test_colormaps
          tests.test_release_version
      - name: Run smoke check
        run: python scripts/smoke_check.py
