name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      app-version: ${{ steps.version.outputs.app-version }}
      zip-name: ${{ steps.version.outputs.zip-name }}
      setup-name: ${{ steps.version.outputs.setup-name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          $version = python scripts/validate_release_version.py --print-version
          if ($LASTEXITCODE -ne 0) { throw "Could not read application version" }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            python scripts/validate_release_version.py --tag "$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw "Tag and application version do not match" }
            $zipName = "DPTK-$env:GITHUB_REF_NAME-Windows-x64.zip"
            $setupName = "DPTK-Setup-$env:GITHUB_REF_NAME-Windows-x64.exe"
          } else {
            $zipName = "DPTK-Windows-x64.zip"
            $setupName = "DPTK-Setup-Windows-x64.exe"
          }
          "app-version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip-name=$zipName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup-name=$setupName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify release tag is contained in main
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          git fetch origin main --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch main for release validation" }
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag $env:GITHUB_REF_NAME is not contained in main. Merge the release commit into main before publishing the tag."
          }

  test-plan:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Create complete test plan
        run: python scripts/run_release_tests.py plan --output build/release-tests/plan.json --shards 4
      - name: Upload test plan
        uses: actions/upload-artifact@v4
        with:
          name: release-test-plan
          path: build/release-tests/plan.json
          if-no-files-found: error

  tests:
    name: Tests (shard ${{ matrix.shard }})
    needs: test-plan
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Download test plan
        uses: actions/download-artifact@v4
        with:
          name: release-test-plan
          path: build/release-tests
      - name: Run isolated test shard
        run: python scripts/run_release_tests.py run --plan build/release-tests/plan.json --shard ${{ matrix.shard }} --output-dir build/release-tests/shard-${{ matrix.shard }}
      - name: Upload test report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-shard-${{ matrix.shard }}
          path: build/release-tests/shard-${{ matrix.shard }}/
          if-no-files-found: warn

  verify-tests:
    needs: [test-plan, tests]
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download test plan
        uses: actions/download-artifact@v4
        with:
          name: release-test-plan
          path: build/release-tests
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: release-test-shard-*
          path: build/release-tests/results
      - name: Verify every planned test passed
        run: python scripts/run_release_tests.py verify --plan build/release-tests/plan.json --results-dir build/release-tests/results

  build:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.preflight.outputs.app-version }}
      ZIP_NAME: ${{ needs.preflight.outputs.zip-name }}
      SETUP_NAME: ${{ needs.preflight.outputs.setup-name }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install NSIS
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Find-Makensis {
              $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
              if ($cmd) { return $cmd.Source }

              $locations = @(
                  "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
                  "$env:ProgramFiles\NSIS\makensis.exe"
              )
              foreach ($loc in $locations) {
                  if (Test-Path -LiteralPath $loc -PathType Leaf) { return $loc }
              }
              return $null
          }

          $makensis = Find-Makensis

          if (-not $makensis) {
              $maxAttempts = 3
              for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
                  Write-Host "NSIS not found; installing with Chocolatey (attempt $attempt/$maxAttempts)..."
                  choco install nsis --yes --no-progress
                  if ($LASTEXITCODE -eq 0) {
                      $makensis = Find-Makensis
                      if ($makensis) {
                          Write-Host "NSIS installed: $makensis"
                          break
                      }
                      Write-Host "Chocolatey reported success but makensis.exe was not found."
                  } else {
                      Write-Host "Chocolatey install failed with exit code $LASTEXITCODE."
                  }

                  if ($attempt -lt $maxAttempts) {
                      Start-Sleep -Seconds 15
                  }
              }
          }

          if (-not $makensis) {
              throw "NSIS installation failed: makensis.exe was not found after $maxAttempts attempt(s)."
          }

          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
              throw "makensis.exe is unusable (version check failed with exit code $LASTEXITCODE)."
          }

          "MAKENSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MAKENSIS_PATH=$makensis"
      - name: Run smoke check
        run: python scripts/smoke_check.py
      - name: Build Windows application
        if: github.event_name != 'pull_request'
        run: .\build_windows.bat
      - name: Upload native Quick packaged-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-quick-packaged-checks
          path: |
            build/frozen-quick-report.json
            build/frozen-quick-report-artifacts/
          if-no-files-found: warn
      - name: Verify executable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist\PySide6_Data_Plot\PySide6_Data_Plot.exe" -PathType Leaf)) { throw "Expected executable was not produced" }
          if (-not (Test-Path -LiteralPath "dist\PySide6_Data_Plot\_internal\matplotlib\mpl-data\matplotlibrc" -PathType Leaf)) { throw "Matplotlib data file was not bundled" }
      - name: Package portable application
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path "dist\PySide6_Data_Plot" -DestinationPath "$env:ZIP_NAME" -Force
      - name: Build installer
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: .\scripts\build_installer.ps1 -Version "$env:APP_VERSION" -OutputFile "$env:SETUP_NAME" -MakensisPath "$env:MAKENSIS_PATH"
      - name: Generate checksums
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $files = @($env:ZIP_NAME, $env:SETUP_NAME)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DPTK-Windows-x64
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}
            SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, verify-tests]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: DPTK-Windows-x64
          path: release-assets
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zipName = "DPTK-$tag-Windows-x64.zip"
          $setupName = "DPTK-Setup-$tag-Windows-x64.exe"
          $downloaded = @(Get-ChildItem -LiteralPath release-assets -File)
          if ($downloaded.Count -ne 3) {
            throw "Expected exactly 3 release assets, found $($downloaded.Count)"
          }
          $assets = @(
            (Join-Path "release-assets" $zipName),
            (Join-Path "release-assets" $setupName),
            (Join-Path "release-assets" "SHA256SUMS.txt")
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create $tag @assets --generate-notes --repo "$env:GITHUB_REPOSITORY" --title $tag
          }
