name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run smoke check
        run: python scripts/smoke_check.py

      - name: Build Windows application
        run: .\build_windows.bat

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\PySide6_Data_Plot\PySide6_Data_Plot.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected executable was not produced: $exe"
          }

      - name: Package distributable
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $zipName = "PySide6_Data_Plot-${{ github.ref_name }}-Windows-x64.zip"
          } else {
            $zipName = "PySide6_Data_Plot-Windows-x64.zip"
          }
          Compress-Archive -Path "dist\PySide6_Data_Plot" -DestinationPath $zipName -Force
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_type == 'tag' && format('PySide6_Data_Plot-{0}-Windows-x64', github.ref_name) || 'PySide6_Data_Plot-Windows-x64' }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: PySide6_Data_Plot-${{ github.ref_name }}-Windows-x64
          path: release-assets

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "release-assets\PySide6_Data_Plot-$tag-Windows-x64.zip"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $zip --generate-notes --repo "${{ github.repository }}" --title $tag
          }
